<!DOCTYPE html>
<html lang="en" class="bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoC-AutoWeb</title>
  <script type="module" src="/src/main.js"></script>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=" />
</head>
<body x-data="app" class="min-h-screen">
  <!-- Connection Bar -->
  <div class="flex items-center gap-4 px-4 py-2 bg-slate-800 border-b border-slate-700">
    <div class="flex items-center gap-2">
      <span
        class="inline-block w-3 h-3 rounded-full"
        :class="adbStatus.connected ? 'bg-green-400' : 'bg-red-400'"
      ></span>
      <span class="text-sm font-medium" x-text="adbStatus.connected ? adbStatus.emulatorName : 'Disconnected'"></span>
    </div>
    <div class="flex items-center gap-2 ml-auto">
      <input
        type="text"
        x-model="adbHost"
        placeholder="127.0.0.1:5555"
        class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm w-40 font-mono"
      />
      <button
        @click="connectAdb()"
        class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-3 py-1 rounded transition-colors"
        :disabled="connecting"
        x-text="connecting ? 'Connecting...' : adbStatus.connected ? 'Reconnect' : 'Connect'"
      ></button>
      <button
        @click="disconnectAdb()"
        class="bg-slate-600 hover:bg-slate-500 text-white text-sm px-3 py-1 rounded transition-colors"
        x-show="adbStatus.connected"
      >Disconnect</button>
    </div>
  </div>

  <!-- Tab Navigation -->
  <nav class="flex gap-1 px-4 bg-slate-850 border-b border-slate-700">
    <template x-for="tab in tabs" :key="tab.id">
      <button
        @click="activeTab = tab.id"
        class="px-4 py-2 text-sm font-medium transition-colors border-b-2"
        :class="activeTab === tab.id ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'"
        x-text="tab.label"
      ></button>
    </template>
  </nav>

  <!-- Tab Content -->
  <main class="p-4">
    <!-- Tab 1: Dashboard -->
    <div x-show="activeTab === 'dashboard'">
      <div class="flex gap-4 flex-wrap">
        <!-- Live Feed -->
        <div class="flex-1 min-w-[400px]">
          <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden canvas-container">
            <canvas id="screenCanvas" class="w-full h-full object-contain bg-black"></canvas>
          </div>
          <div class="flex gap-2 mt-3">
            <button @click="startStream()" :disabled="!adbStatus.connected || streaming"
              class="bg-green-600 hover:bg-green-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 py-1.5 rounded text-sm transition-colors">
              START
            </button>
            <button @click="pauseStream()" :disabled="!streaming"
              class="bg-yellow-600 hover:bg-yellow-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 py-1.5 rounded text-sm transition-colors">
              PAUSE
            </button>
            <button @click="stopStream()" :disabled="!wsScreen"
              class="bg-red-600 hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-4 py-1.5 rounded text-sm transition-colors">
              STOP
            </button>
            <span class="text-xs text-slate-400 self-center ml-2">
              FPS: <span x-text="fps">0</span>
            </span>
          </div>
        </div>

        <!-- Status Panel -->
        <div class="w-64 flex flex-col gap-3">
          <div class="bg-slate-800 rounded-lg border border-slate-700 p-4">
            <h3 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Bot Status</h3>
            <span class="inline-block px-2 py-1 rounded text-xs font-bold bg-slate-700 text-slate-300">IDLE</span>
          </div>
          <div class="bg-slate-800 rounded-lg border border-slate-700 p-4">
            <h3 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Summary</h3>
            <div class="text-sm space-y-1">
              <div class="flex justify-between"><span>Gold</span><span class="text-yellow-400">--</span></div>
              <div class="flex justify-between"><span>Elixir</span><span class="text-pink-400">--</span></div>
              <div class="flex justify-between"><span>Dark E.</span><span class="text-slate-400">--</span></div>
              <div class="flex justify-between"><span>Raids</span><span>0</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: Calibrator -->
    <div x-show="activeTab === 'calibrator'" class="flex gap-4 flex-wrap">
      <!-- Screenshot canvas -->
      <div class="flex-1 min-w-[400px]">
        <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-hidden canvas-container relative" id="calibratorContainer">
          <canvas id="calibratorCanvas" class="w-full h-full object-contain bg-black"></canvas>
          <!-- ROI overlay box -->
          <div id="roiBox" class="absolute border-2 border-blue-400 bg-blue-400/20 pointer-events-none hidden"></div>
        </div>
        <div class="flex gap-2 mt-3">
          <button @click="captureScreenshot()" :disabled="!adbStatus.connected"
            class="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white px-4 py-1.5 rounded text-sm transition-colors">
            Capture Screenshot
          </button>
          <button @click="saveRoi()" :disabled="!roiActive"
            class="bg-green-600 hover:bg-green-500 disabled:opacity-50 text-white px-4 py-1.5 rounded text-sm transition-colors">
            Save ROI
          </button>
          <button @click="testOcr()" :disabled="!roiActive"
            class="bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white px-4 py-1.5 rounded text-sm transition-colors">
            Test OCR
          </button>
          <button @click="clearRoi()" :disabled="!roiActive"
            class="bg-slate-600 hover:bg-slate-500 text-white px-4 py-1.5 rounded text-sm transition-colors">
            Clear
          </button>
        </div>
        <div x-show="roiActive" class="mt-2 p-2 bg-slate-800 rounded border border-slate-700 text-xs font-mono">
          ROI: <span x-text="roiCoords">0, 0, 0, 0</span>
          <span x-show="ocrResult" class="ml-4">| OCR: <span x-text="ocrResult" class="text-green-400"></span></span>
        </div>
      </div>

      <!-- ROI list panel -->
      <div class="w-64 flex flex-col gap-3">
        <div class="bg-slate-800 rounded-lg border border-slate-700 p-4">
          <h3 class="text-xs uppercase tracking-wider text-slate-400 mb-2">Saved ROIs</h3>
          <input x-model="roiName" placeholder="ROI name (e.g. btn_attack)"
            class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm w-full mb-2 font-mono" />
          <div class="space-y-1 max-h-80 overflow-y-auto" id="roiList">
            <template x-for="roi in savedRois" :key="roi.id">
              <div class="flex items-center justify-between text-xs bg-slate-700 rounded p-1.5">
                <span x-text="roi.roi_name" class="text-blue-300 font-mono"></span>
                <button @click="deleteRoi(roi.id)" class="text-red-400 hover:text-red-300">&times;</button>
              </div>
            </template>
            <p x-show="savedRois.length === 0" class="text-slate-500 text-xs">No ROIs saved yet</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 3: Farming -->
    <div x-show="activeTab === 'farming'" class="max-w-md">
      <div class="bg-slate-800 rounded-lg border border-slate-700 p-4 mb-4">
        <h3 class="text-sm uppercase tracking-wider text-slate-400 mb-3">Loot Thresholds</h3>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-slate-400">Min Gold</label>
            <input type="number" x-model="farmingConfig.min_gold" @change="saveFarmingConfig()"
              class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm w-full mt-1" />
          </div>
          <div>
            <label class="text-xs text-slate-400">Min Elixir</label>
            <input type="number" x-model="farmingConfig.min_elixir" @change="saveFarmingConfig()"
              class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm w-full mt-1" />
          </div>
          <div>
            <label class="text-xs text-slate-400">Min Dark Elixir</label>
            <input type="number" x-model="farmingConfig.min_dark_elixir" @change="saveFarmingConfig()"
              class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm w-full mt-1" />
          </div>
          <div>
            <label class="text-xs text-slate-400">Max Search Skipping</label>
            <input type="number" x-model="farmingConfig.max_searches" @change="saveFarmingConfig()"
              class="bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm w-full mt-1" />
          </div>
        </div>
      </div>

      <div class="bg-slate-800 rounded-lg border border-slate-700 p-4">
        <h3 class="text-sm uppercase tracking-wider text-slate-400 mb-3">Deployment Strategy</h3>
        <div class="space-y-2">
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="radio" x-model="farmingConfig.strategy" value="4finger" @change="saveFarmingConfig()" />
            <span>4-Finger Drop</span>
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="radio" x-model="farmingConfig.strategy" value="perimeter" @change="saveFarmingConfig()" />
            <span>Perimeter Line Sweep</span>
          </label>
          <label class="flex items-center gap-2 text-sm cursor-pointer">
            <input type="radio" x-model="farmingConfig.strategy" value="snipe" @change="saveFarmingConfig()" />
            <span>Collector Snipe</span>
          </label>
        </div>
      </div>
    </div>
    <div x-show="activeTab === 'builder'" class="flex items-center justify-center h-64">
      <p class="text-slate-500 text-lg">Builder -- Coming Soon</p>
    </div>
    <div x-show="activeTab === 'analytics'" class="flex items-center justify-center h-64">
      <p class="text-slate-500 text-lg">Analytics -- Coming Soon</p>
    </div>
    <div x-show="activeTab === 'logs'" class="flex items-center justify-center h-64">
      <p class="text-slate-500 text-lg">Logs -- Coming Soon</p>
    </div>
  </main>

</body>
</html>
